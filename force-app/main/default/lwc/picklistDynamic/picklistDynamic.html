<template>
    <lightning-card title="Dynamic Picklist from Metadata">
        <div class="slds-p-around_medium">
            <template if:true={picklistValues}>
                <lightning-combobox
                    name="leadSource"
                    label="Lead Source"
                    value={selectedValue}
                    options={picklistValues}
                    onchange={handleChange}>
                </lightning-combobox>
            </template>
            <template if:true={error}>
                <p class="slds-text-color_error">Error: {error}</p>
            </template>
        </div>
    </lightning-card>
</template>
