<template>
    <lightning-card title="Toggle Switch Example">
        <div class="slds-p-around_medium">
            <lightning-input
                type="toggle"
                label="Enable Feature"
                checked={isToggled}
                onchange={handleToggle}>
            </lightning-input>

            <p class="slds-m-top_medium">
                Feature is <strong>{toggleLabel}</strong>
            </p>
        </div>
    </lightning-card>
</template>
